<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'self' blob: https: http:; connect-src https: http: data: blob:; img-src https: http: data: blob:; style-src 'unsafe-inline'; font-src data:;"
    />
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0c0d0d; }
      body { display: grid; place-items: center; }
      canvas { display: block; max-width: 100%; max-height: 100%; }
    </style>
  </head>
  <body>
    <script>
      document.documentElement.dataset.runtime = "loaded";
      const THREE_MODULE_URL = "/vendor/three/build/three.module.min.js";
      const nativeRequestAnimationFrame = window.requestAnimationFrame.bind(window);
      const nativeCancelAnimationFrame = window.cancelAnimationFrame.bind(window);
      let blockedAnimationFrameCalls = 0;

      // The host owns the render loop. User-owned RAF loops would advance state at
      // the display refresh rate during preview but at a different rate while exporting.
      window.requestAnimationFrame = () => {
        blockedAnimationFrameCalls += 1;
        return -blockedAnimationFrameCalls;
      };
      window.cancelAnimationFrame = () => {};

      let runId = 0;
      let initialized = false;
      let initializing = false;
      let exporting = false;
      let rendering = false;
      let previewFailed = false;
      let previewStartedAt = performance.now();
      let previewFps = 30;
      let lastPreviewFrameAt = 0;
      let previewWidth = 720;
      let previewHeight = 1280;
      let exportWidth = 0;
      let exportHeight = 0;
      const trackedThree = { renderer: null, camera: null };
      let assetOverrides = {};
      let replacementSources = new Set();
      const candidateCatalog = new Map();
      let candidateUpdateTimer = 0;
      const registeredSlots = new Map();
      const sourceAliases = new Map();
      const suppressedInputs = new WeakSet();
      const pickerInputs = new Map();
      const slotOverrideTasks = new Set();
      const pendingSourceLoads = new Set();
      const pendingByImage = new WeakMap();
      let inputScanTimer = 0;
      const normalizedCanvas = document.createElement("canvas");

      const send = (type, payload = {}) => {
        parent.postMessage({ source: "three-preview", runId, type, ...payload }, "*");
      };

      const describe = (value) => {
        if (value instanceof Error) {
          const message = value.message || String(value);
          const stack = value.stack || "";
          return stack.includes(message) ? stack : [message, stack].filter(Boolean).join("\n");
        }
        if (typeof value === "string") return value;
        try { return JSON.stringify(value, null, 2); } catch { return String(value); }
      };

      function trackRenderer(renderer) {
        trackedThree.renderer = renderer;
        if (renderer.__threePreviewTracked) return renderer;
        const originalRender = renderer.render;
        Object.defineProperty(renderer, "__threePreviewTracked", { value: true });
        renderer.render = function (scene, camera) {
          trackedThree.renderer = this;
          trackedThree.camera = camera;
          return originalRender.call(this, scene, camera);
        };
        return renderer;
      }

      function hashSource(value) {
        let hash = 0xcbf29ce484222325n;
        for (let index = 0; index < value.length; index++) {
          hash ^= BigInt(value.charCodeAt(index));
          hash = (hash * 0x100000001b3n) & 0xffffffffffffffffn;
        }
        return hash.toString(16).padStart(16, "0");
      }

      function normalizeSource(value) {
        const source = String(value || "");
        if (!source || source.startsWith("blob:") || source.startsWith("about:")) return "";
        if (source.startsWith("data:image/")) return source;
        try {
          const url = new URL(source, location.href);
          return ["http:", "https:"].includes(url.protocol) ? url.href : "";
        } catch { return ""; }
      }

      function sourceKey(source) { return `image:${hashSource(source)}`; }

      function sourceLabel(source) {
        if (source.startsWith("data:")) return "埋め込み画像";
        try {
          const url = new URL(source);
          const file = decodeURIComponent(url.pathname.split("/").filter(Boolean).at(-1) || url.hostname);
          return file.length > 60 ? `${file.slice(0, 57)}…` : file;
        } catch { return "画像ファイル"; }
      }

      function sendCandidatesSoon() {
        if (candidateUpdateTimer) return;
        candidateUpdateTimer = setTimeout(() => {
          candidateUpdateTimer = 0;
          send("texture-candidates", { candidates: [...candidateCatalog.values()] });
        }, 150);
      }

      function thumbnailFromTexture(texture) {
        const source = texture?.image;
        if (!source?.width || !source?.height) return "";
        try {
          const canvas = document.createElement("canvas");
          canvas.width = 96;
          canvas.height = 96;
          canvas.getContext("2d").drawImage(source, 0, 0, 96, 96);
          return canvas.toDataURL("image/png");
        } catch { return source.src?.startsWith("http") ? source.src : ""; }
      }

      function refreshSlotThumbnail(key) {
        const slot = registeredSlots.get(key);
        const candidate = candidateCatalog.get(key);
        if (!slot || !candidate) return;
        let thumbnail = "";
        try { thumbnail = thumbnailFromTexture(slot.getTexture?.()); } catch { return; }
        if (thumbnail && thumbnail !== candidate.thumbnail) {
          candidate.thumbnail = thumbnail;
          sendCandidatesSoon();
        }
      }

      globalThis.registerImageSlot = (slot) => {
        if (!/^[a-zA-Z0-9_-]{1,80}$/.test(slot?.id) || !slot.label || typeof slot.apply !== "function") {
          throw new Error("registerImageSlotには英数字のid、label、applyが必要です。");
        }
        const key = `slot:${slot.id}`;
        registeredSlots.set(key, slot);
        if (slot.input instanceof HTMLInputElement) suppressedInputs.add(slot.input);
        for (const value of Array.isArray(slot.sources) ? slot.sources : []) {
          const source = normalizeSource(value);
          if (!source) continue;
          sourceAliases.set(source, key);
          candidateCatalog.delete(sourceKey(source));
        }
        candidateCatalog.set(key, { key, label: slot.label, thumbnail: "" });
        sendCandidatesSoon();
        const task = Promise.resolve(slot.ready).catch(() => {}).then(async () => {
          if (assetOverrides[key]) await slot.apply(assetOverrides[key]);
          refreshSlotThumbnail(key);
        });
        if (assetOverrides[key]) {
          slotOverrideTasks.add(task);
          task.catch(() => {});
        } else task.catch(() => {});
        return task;
      };

      function trackImageSource(image, value, nativeSetter) {
        const prior = pendingByImage.get(image);
        prior?.cancel();
        const source = normalizeSource(value);
        if (!source || source.includes("/api/assets/") || replacementSources.has(source)) {
          if (String(value).startsWith("blob:")) watchImageLoad(image, String(value));
          nativeSetter.call(image, value);
          return;
        }
        const key = sourceAliases.get(source) || sourceKey(source);
        if (!candidateCatalog.has(key)) {
          candidateCatalog.set(key, {
            key,
            label: sourceLabel(source),
            thumbnail: source.startsWith("data:") ? "" : source
          });
          sendCandidatesSoon();
        }
        watchImageLoad(image, source, key);
        if (assetOverrides[key]) image.crossOrigin = "anonymous";
        nativeSetter.call(image, assetOverrides[key] || value);
      }

      function watchImageLoad(image, source, key = "") {
        const pending = { image, source };
        pendingSourceLoads.add(pending);
        pendingByImage.set(image, pending);
        pending.cancel = () => {
          image.removeEventListener("load", complete);
          image.removeEventListener("error", complete);
          pendingSourceLoads.delete(pending);
          if (pendingByImage.get(image) === pending) pendingByImage.delete(image);
        };
        const complete = (event) => {
          pending.cancel();
          const candidate = key && candidateCatalog.get(key);
          if (event.type === "load" && candidate && key.startsWith("image:") &&
              !candidate.thumbnail.startsWith("data:")) {
            const thumbnail = thumbnailFromTexture({ image });
            if (thumbnail) {
              candidate.thumbnail = thumbnail;
              sendCandidatesSoon();
            }
          }
        };
        image.addEventListener("load", complete);
        image.addEventListener("error", complete);
      }

      const imageSourceDescriptor = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
      if (imageSourceDescriptor?.set) {
        Object.defineProperty(HTMLImageElement.prototype, "src", {
          configurable: true,
          enumerable: imageSourceDescriptor.enumerable,
          get: imageSourceDescriptor.get,
          set(value) { trackImageSource(this, value, imageSourceDescriptor.set); }
        });
        const nativeSetAttribute = HTMLImageElement.prototype.setAttribute;
        HTMLImageElement.prototype.setAttribute = function (name, value) {
          if (String(name).toLowerCase() === "src") {
            this.src = value;
            return;
          }
          return nativeSetAttribute.call(this, name, value);
        };
      }

      async function waitForImageLoads(timeoutMs = 15_000) {
        const end = performance.now() + timeoutMs;
        while (pendingSourceLoads.size && performance.now() < end) await nextPaint();
        await Promise.resolve();
      }

      function scanImageInputs() {
        const inputs = [...document.querySelectorAll('input[type="file"]')]
          .filter((input) => !suppressedInputs.has(input) && /image|\.png|\.jpe?g|\.webp/i.test(input.accept));
        inputs.forEach((input, index) => {
          const key = `picker:${hashSource(input.id || input.name || String(index))}`;
          pickerInputs.set(key, input);
          if (!candidateCatalog.has(key)) {
            const label = input.getAttribute("aria-label") || input.labels?.[0]?.textContent?.trim() ||
              input.parentElement?.querySelector("button")?.textContent?.trim() || `画像選択 ${index + 1}`;
            candidateCatalog.set(key, { key, label, thumbnail: "" });
            sendCandidatesSoon();
          }
          if (assetOverrides[key] && !input.dataset.previewOverrideApplied) {
            input.dataset.previewOverrideApplied = "1";
            const task = applyFileInputOverride(input, assetOverrides[key]);
            slotOverrideTasks.add(task);
            task.catch(() => {});
          }
        });
      }

      async function applyFileInputOverride(input, url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error("保存した画像を読み込めませんでした。");
        const blob = await response.blob();
        const file = new File([blob], "replacement-image", { type: blob.type });
        const transfer = new DataTransfer();
        transfer.items.add(file);
        input.files = transfer.files;
        input.dispatchEvent(new Event("change", { bubbles: true }));
        await waitForImageLoads();
        await nextPaint();
      }

      new MutationObserver(() => {
        if (inputScanTimer) return;
        inputScanTimer = setTimeout(() => {
          inputScanTimer = 0;
          scanImageInputs();
        }, 100);
      }).observe(document.body, { childList: true, subtree: true });

      function createTrackedThree(module) {
        let TrackedWebGLRenderer;
        TrackedWebGLRenderer = new Proxy(module.WebGLRenderer, {
          construct(target, args, newTarget) {
            const actualNewTarget = newTarget === TrackedWebGLRenderer ? target : newTarget;
            return trackRenderer(Reflect.construct(target, args, actualNewTarget));
          }
        });
        return Object.assign(Object.create(null), module, { WebGLRenderer: TrackedWebGLRenderer });
      }

      async function automaticSetRenderSize(width, height) {
        const renderer = trackedThree.renderer;
        if (!renderer || typeof renderer.setSize !== "function") {
          throw new Error("Three.jsのレンダラーを自動取得できません。globalThis.setRenderSize(width, height) を定義してください。");
        }

        if (typeof renderer.setPixelRatio === "function") renderer.setPixelRatio(1);
        const camera = trackedThree.camera;
        if (camera?.isPerspectiveCamera) {
          camera.aspect = width / height;
        } else if (camera?.isOrthographicCamera) {
          const centerX = (camera.left + camera.right) / 2;
          const verticalSpan = camera.top - camera.bottom;
          const horizontalSpan = verticalSpan * (width / height);
          camera.left = centerX - horizontalSpan / 2;
          camera.right = centerX + horizontalSpan / 2;
        } else if (camera && "aspect" in camera) {
          camera.aspect = width / height;
        }
        if (typeof camera?.updateProjectionMatrix === "function") camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
      }

      const nextPaint = () => new Promise((resolve) => {
        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          resolve();
        };
        nativeRequestAnimationFrame(finish);
        setTimeout(finish, 50);
      });

      const canvasToPngBlob = (sourceCanvas) => new Promise((resolve, reject) => {
        try {
          let canvas = sourceCanvas;
          if (exportWidth > 0 && exportHeight > 0 &&
              (sourceCanvas.width !== exportWidth || sourceCanvas.height !== exportHeight)) {
            normalizedCanvas.width = exportWidth;
            normalizedCanvas.height = exportHeight;
            const context = normalizedCanvas.getContext("2d", { alpha: true });
            if (!context) throw new Error("書き出し用Canvasを作成できませんでした。");
            context.clearRect(0, 0, exportWidth, exportHeight);
            context.drawImage(sourceCanvas, 0, 0, exportWidth, exportHeight);
            canvas = normalizedCanvas;
          }
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error("CanvasをPNG化できませんでした。"));
          }, "image/png");
        } catch (error) {
          reject(new Error("CanvasのPNG化に失敗しました。外部画像のCORS設定を確認してください。\n" + error.message));
        }
      });

      window.addEventListener("error", (event) => {
        if (initialized) send("error", { message: event.error?.stack || event.message });
      });

      window.addEventListener("unhandledrejection", (event) => {
        if (initialized) send("error", { message: describe(event.reason) });
      });

      const originalError = console.error;
      console.error = (...args) => {
        originalError(...args);
        if (initialized) send("console-error", { message: args.map(describe).join(" ") });
      };

      async function resizeRenderer(width, height) {
        await globalThis.setRenderSize(width, height);
        await nextPaint();
      }

      async function renderPreview(now) {
        nativeRequestAnimationFrame(renderPreview);
        if (!initialized || exporting || rendering || previewFailed) return;
        const frameInterval = 1000 / previewFps;
        if (now - lastPreviewFrameAt < frameInterval - 1) return;
        lastPreviewFrameAt = now - ((now - lastPreviewFrameAt) % frameInterval);
        rendering = true;
        try {
          await globalThis.renderAt((now - previewStartedAt) / 1000);
        } catch (error) {
          previewFailed = true;
          send("error", { message: describe(error) });
        } finally {
          rendering = false;
        }
      }

      async function waitForIdle() {
        while (rendering) await nextPaint();
      }

      function getDeclaredDuration() {
        const value = globalThis.exportDurationSeconds ?? globalThis.EXPORT_CONFIG?.duration;
        const seconds = Number(value);
        return Number.isFinite(seconds) && seconds >= 1 ? seconds : null;
      }

      async function initialize(code, width, height, fps, overrides) {
        previewWidth = width;
        previewHeight = height;
        previewFps = fps === 24 ? 24 : 30;
        assetOverrides = overrides || {};
        replacementSources = new Set(Object.values(assetOverrides).map(normalizeSource).filter(Boolean));
        document.documentElement.dataset.stage = "importing-three";
        const threeModule = await import(THREE_MODULE_URL);
        document.documentElement.dataset.stage = "three-loaded";
        globalThis.THREE = createTrackedThree(threeModule);
        const userModuleSource = [
          "const THREE = globalThis.THREE;",
          code,
          "//# sourceURL=three-preview-user-code.js"
        ].join("\n");
        const moduleUrl = URL.createObjectURL(new Blob([userModuleSource], { type: "text/javascript" }));

        try {
          document.documentElement.dataset.stage = "importing-user-code";
          await import(moduleUrl);
          document.documentElement.dataset.stage = "user-code-loaded";
        } finally {
          URL.revokeObjectURL(moduleUrl);
        }

        scanImageInputs();
        await waitForImageLoads();
        await Promise.all([...slotOverrideTasks]);
        slotOverrideTasks.clear();

        if (typeof globalThis.renderAt !== "function") {
          throw new Error("globalThis.renderAt(timeSeconds) を定義してください。");
        }
        if (!document.querySelector("canvas")) {
          throw new Error("Three.jsのCanvasが見つかりません。");
        }

        await globalThis.renderAt(0);
        if (typeof globalThis.setRenderSize !== "function") {
          globalThis.setRenderSize = automaticSetRenderSize;
        }
        await resizeRenderer(previewWidth, previewHeight);
        await globalThis.renderAt(0);
        initialized = true;
        document.documentElement.dataset.stage = "initialized";
        previewStartedAt = performance.now();
        lastPreviewFrameAt = previewStartedAt;
        send("ready", { duration: getDeclaredDuration() });
      }

      window.addEventListener("message", async (event) => {
        document.documentElement.dataset.messages = String(Number(document.documentElement.dataset.messages || 0) + 1);
        if (event.source !== parent || event.data?.source !== "three-preview-host") return;
        const data = event.data;

        if (data.type === "initialize") {
          if (initialized || initializing) return;
          runId = data.runId;
          initializing = true;
          try {
            await initialize(data.code, data.width, data.height, data.fps, data.overrides);
          } catch (error) {
            send("error", { message: describe(error) });
          } finally {
            if (!initialized) initializing = false;
          }
          return;
        }

        if (!initialized || data.runId !== runId) return;

        if (data.type === "preview-fps") {
          previewFps = data.fps === 24 ? 24 : 30;
          lastPreviewFrameAt = performance.now();
        }

        if (data.type === "preview-resize") {
          try {
            await waitForIdle();
            previewWidth = data.width;
            previewHeight = data.height;
            await resizeRenderer(previewWidth, previewHeight);
            await globalThis.renderAt((performance.now() - previewStartedAt) / 1000);
            previewFailed = false;
            send("preview-resized", { width: previewWidth, height: previewHeight });
          } catch (error) {
            send("preview-resize-error", { message: describe(error) });
          }
        }

        if (data.type === "export-begin") {
          try {
            exporting = true;
            exportWidth = data.width;
            exportHeight = data.height;
            await waitForIdle();
            await resizeRenderer(data.width, data.height);
            send("export-ready");
          } catch (error) {
            exporting = false;
            exportWidth = 0;
            exportHeight = 0;
            send("export-error", { message: describe(error) });
          }
        }

        if (data.type === "export-frame") {
          try {
            await globalThis.renderAt(data.timeSeconds);
            await nextPaint();
            const canvas = document.querySelector("canvas");
            if (!canvas) throw new Error("書き出せるCanvasが見つかりません。");
            const blob = await canvasToPngBlob(canvas);
            send("export-frame", { requestId: data.requestId, blob, width: exportWidth, height: exportHeight });
          } catch (error) {
            send("export-frame-error", { requestId: data.requestId, message: describe(error) });
          }
        }

        if (data.type === "export-end") {
          try {
            await resizeRenderer(previewWidth, previewHeight);
            await globalThis.renderAt(0);
            previewStartedAt = performance.now();
            lastPreviewFrameAt = previewStartedAt;
            previewFailed = false;
            send("export-ended", { width: previewWidth, height: previewHeight });
          } catch (error) {
            send("export-restore-error", { message: describe(error) });
          } finally {
            exporting = false;
            exportWidth = 0;
            exportHeight = 0;
          }
        }
      });

      nativeRequestAnimationFrame(renderPreview);
      document.documentElement.dataset.runtime = "ready";
      send("runtime-ready");
    </script>
  </body>
</html>
