<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'self' blob:; connect-src https:; img-src https: data: blob:; style-src 'unsafe-inline'; font-src data:;"
    />
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0c0d0d; }
      body { display: grid; place-items: center; }
      canvas { display: block; max-width: 100%; max-height: 100%; }
    </style>
  </head>
  <body>
    <script>
      document.documentElement.dataset.runtime = "loaded";
      const THREE_MODULE_URL = "/vendor/three/build/three.module.min.js";
      const nativeRequestAnimationFrame = window.requestAnimationFrame.bind(window);
      const nativeCancelAnimationFrame = window.cancelAnimationFrame.bind(window);
      let blockedAnimationFrameCalls = 0;

      // The host owns the render loop. User-owned RAF loops would advance state at
      // the display refresh rate during preview but at a different rate while exporting.
      window.requestAnimationFrame = () => {
        blockedAnimationFrameCalls += 1;
        return -blockedAnimationFrameCalls;
      };
      window.cancelAnimationFrame = () => {};

      let runId = 0;
      let initialized = false;
      let initializing = false;
      let exporting = false;
      let rendering = false;
      let previewFailed = false;
      let previewStartedAt = performance.now();
      let previewFps = 30;
      let lastPreviewFrameAt = 0;
      let previewWidth = 720;
      let previewHeight = 1280;
      let exportWidth = 0;
      let exportHeight = 0;
      const trackedThree = { renderer: null, camera: null };
      const normalizedCanvas = document.createElement("canvas");

      const send = (type, payload = {}) => {
        parent.postMessage({ source: "three-preview", runId, type, ...payload }, "*");
      };

      const describe = (value) => {
        if (value instanceof Error) {
          const message = value.message || String(value);
          const stack = value.stack || "";
          return stack.includes(message) ? stack : [message, stack].filter(Boolean).join("\n");
        }
        if (typeof value === "string") return value;
        try { return JSON.stringify(value, null, 2); } catch { return String(value); }
      };

      function trackRenderer(renderer) {
        trackedThree.renderer = renderer;
        if (renderer.__threePreviewTracked) return renderer;
        const originalRender = renderer.render;
        Object.defineProperty(renderer, "__threePreviewTracked", { value: true });
        renderer.render = function (scene, camera) {
          trackedThree.renderer = this;
          trackedThree.camera = camera;
          return originalRender.call(this, scene, camera);
        };
        return renderer;
      }

      function createTrackedThree(module) {
        let TrackedWebGLRenderer;
        TrackedWebGLRenderer = new Proxy(module.WebGLRenderer, {
          construct(target, args, newTarget) {
            const actualNewTarget = newTarget === TrackedWebGLRenderer ? target : newTarget;
            return trackRenderer(Reflect.construct(target, args, actualNewTarget));
          }
        });
        return Object.assign(Object.create(null), module, { WebGLRenderer: TrackedWebGLRenderer });
      }

      async function automaticSetRenderSize(width, height) {
        const renderer = trackedThree.renderer;
        if (!renderer || typeof renderer.setSize !== "function") {
          throw new Error("Three.jsのレンダラーを自動取得できません。globalThis.setRenderSize(width, height) を定義してください。");
        }

        if (typeof renderer.setPixelRatio === "function") renderer.setPixelRatio(1);
        const camera = trackedThree.camera;
        if (camera?.isPerspectiveCamera) {
          camera.aspect = width / height;
        } else if (camera?.isOrthographicCamera) {
          const centerX = (camera.left + camera.right) / 2;
          const verticalSpan = camera.top - camera.bottom;
          const horizontalSpan = verticalSpan * (width / height);
          camera.left = centerX - horizontalSpan / 2;
          camera.right = centerX + horizontalSpan / 2;
        } else if (camera && "aspect" in camera) {
          camera.aspect = width / height;
        }
        if (typeof camera?.updateProjectionMatrix === "function") camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
      }

      const nextPaint = () => new Promise((resolve) => {
        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          resolve();
        };
        nativeRequestAnimationFrame(finish);
        setTimeout(finish, 50);
      });

      const canvasToPngBlob = (sourceCanvas) => new Promise((resolve, reject) => {
        try {
          let canvas = sourceCanvas;
          if (exportWidth > 0 && exportHeight > 0 &&
              (sourceCanvas.width !== exportWidth || sourceCanvas.height !== exportHeight)) {
            normalizedCanvas.width = exportWidth;
            normalizedCanvas.height = exportHeight;
            const context = normalizedCanvas.getContext("2d", { alpha: true });
            if (!context) throw new Error("書き出し用Canvasを作成できませんでした。");
            context.clearRect(0, 0, exportWidth, exportHeight);
            context.drawImage(sourceCanvas, 0, 0, exportWidth, exportHeight);
            canvas = normalizedCanvas;
          }
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error("CanvasをPNG化できませんでした。"));
          }, "image/png");
        } catch (error) {
          reject(new Error("CanvasのPNG化に失敗しました。外部画像のCORS設定を確認してください。\n" + error.message));
        }
      });

      window.addEventListener("error", (event) => {
        if (initialized) send("error", { message: event.error?.stack || event.message });
      });

      window.addEventListener("unhandledrejection", (event) => {
        if (initialized) send("error", { message: describe(event.reason) });
      });

      const originalError = console.error;
      console.error = (...args) => {
        originalError(...args);
        if (initialized) send("console-error", { message: args.map(describe).join(" ") });
      };

      async function resizeRenderer(width, height) {
        await globalThis.setRenderSize(width, height);
        await nextPaint();
      }

      async function renderPreview(now) {
        nativeRequestAnimationFrame(renderPreview);
        if (!initialized || exporting || rendering || previewFailed) return;
        const frameInterval = 1000 / previewFps;
        if (now - lastPreviewFrameAt < frameInterval - 1) return;
        lastPreviewFrameAt = now - ((now - lastPreviewFrameAt) % frameInterval);
        rendering = true;
        try {
          await globalThis.renderAt((now - previewStartedAt) / 1000);
        } catch (error) {
          previewFailed = true;
          send("error", { message: describe(error) });
        } finally {
          rendering = false;
        }
      }

      async function waitForIdle() {
        while (rendering) await nextPaint();
      }

      async function initialize(code, width, height, fps) {
        previewWidth = width;
        previewHeight = height;
        previewFps = fps === 24 ? 24 : 30;
        document.documentElement.dataset.stage = "importing-three";
        const threeModule = await import(THREE_MODULE_URL);
        document.documentElement.dataset.stage = "three-loaded";
        globalThis.THREE = createTrackedThree(threeModule);
        const userModuleSource = [
          "const THREE = globalThis.THREE;",
          code,
          "//# sourceURL=three-preview-user-code.js"
        ].join("\n");
        const moduleUrl = URL.createObjectURL(new Blob([userModuleSource], { type: "text/javascript" }));

        try {
          document.documentElement.dataset.stage = "importing-user-code";
          await import(moduleUrl);
          document.documentElement.dataset.stage = "user-code-loaded";
        } finally {
          URL.revokeObjectURL(moduleUrl);
        }

        if (typeof globalThis.renderAt !== "function") {
          throw new Error("globalThis.renderAt(timeSeconds) を定義してください。");
        }
        if (!document.querySelector("canvas")) {
          throw new Error("Three.jsのCanvasが見つかりません。");
        }

        await globalThis.renderAt(0);
        if (typeof globalThis.setRenderSize !== "function") {
          globalThis.setRenderSize = automaticSetRenderSize;
        }
        await resizeRenderer(previewWidth, previewHeight);
        await globalThis.renderAt(0);
        initialized = true;
        document.documentElement.dataset.stage = "initialized";
        previewStartedAt = performance.now();
        lastPreviewFrameAt = previewStartedAt;
        send("ready");
      }

      window.addEventListener("message", async (event) => {
        document.documentElement.dataset.messages = String(Number(document.documentElement.dataset.messages || 0) + 1);
        if (event.source !== parent || event.data?.source !== "three-preview-host") return;
        const data = event.data;

        if (data.type === "initialize") {
          if (initialized || initializing) return;
          runId = data.runId;
          initializing = true;
          try {
            await initialize(data.code, data.width, data.height, data.fps);
          } catch (error) {
            send("error", { message: describe(error) });
          } finally {
            if (!initialized) initializing = false;
          }
          return;
        }

        if (!initialized || data.runId !== runId) return;

        if (data.type === "preview-fps") {
          previewFps = data.fps === 24 ? 24 : 30;
          lastPreviewFrameAt = performance.now();
        }

        if (data.type === "preview-resize") {
          try {
            await waitForIdle();
            previewWidth = data.width;
            previewHeight = data.height;
            await resizeRenderer(previewWidth, previewHeight);
            await globalThis.renderAt((performance.now() - previewStartedAt) / 1000);
            previewFailed = false;
            send("preview-resized", { width: previewWidth, height: previewHeight });
          } catch (error) {
            send("preview-resize-error", { message: describe(error) });
          }
        }

        if (data.type === "export-begin") {
          try {
            exporting = true;
            exportWidth = data.width;
            exportHeight = data.height;
            await waitForIdle();
            await resizeRenderer(data.width, data.height);
            send("export-ready");
          } catch (error) {
            exporting = false;
            exportWidth = 0;
            exportHeight = 0;
            send("export-error", { message: describe(error) });
          }
        }

        if (data.type === "export-frame") {
          try {
            await globalThis.renderAt(data.timeSeconds);
            await nextPaint();
            const canvas = document.querySelector("canvas");
            if (!canvas) throw new Error("書き出せるCanvasが見つかりません。");
            const blob = await canvasToPngBlob(canvas);
            send("export-frame", { requestId: data.requestId, blob, width: exportWidth, height: exportHeight });
          } catch (error) {
            send("export-frame-error", { requestId: data.requestId, message: describe(error) });
          }
        }

        if (data.type === "export-end") {
          try {
            await resizeRenderer(previewWidth, previewHeight);
            await globalThis.renderAt(0);
            previewStartedAt = performance.now();
            lastPreviewFrameAt = previewStartedAt;
            previewFailed = false;
            send("export-ended", { width: previewWidth, height: previewHeight });
          } catch (error) {
            send("export-restore-error", { message: describe(error) });
          } finally {
            exporting = false;
            exportWidth = 0;
            exportHeight = 0;
          }
        }
      });

      nativeRequestAnimationFrame(renderPreview);
      document.documentElement.dataset.runtime = "ready";
      send("runtime-ready");
    </script>
  </body>
</html>
